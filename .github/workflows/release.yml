# Builds prebuilt release binaries (Linux / macOS / Windows) and attaches them to
# a GitHub Release on v* tag pushes. Manual runs (workflow_dispatch) build and
# upload the binaries as run artifacts so they can be grabbed from the Actions
# page without cutting a tag.
#
# No secrets/tokens are hardcoded: release uploads use the automatic
# GITHUB_TOKEN (contents: write grants it the minimal scope it needs).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: celestea-linux-x86_64
            ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset: celestea-macos-aarch64
            ext: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            asset: celestea-macos-x86_64
            ext: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: celestea-windows-x86_64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release -p celestea-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf \
            "dist/${{ matrix.asset }}.tar.gz" celestea

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/celestea.exe" \
            -DestinationPath "dist/${{ matrix.asset }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/

  release:
    name: Publish GitHub Release
    needs: build
    # Only tag pushes publish a Release; workflow_dispatch keeps the run
    # artifacts (grabbable from the Actions page) without creating one.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
