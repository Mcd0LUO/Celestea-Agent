<!doctype html>
<html lang="zh-CN" data-theme="mono">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Celestea Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d0f12'/%3E%3Crect x='5' y='5' width='6' height='6' rx='1.2' fill='none' stroke='%237f93b0' stroke-width='1.4'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">

    <!-- ===================== 顶栏 ===================== -->
    <header id="topbar">
      <div class="topbar-left">
        <span class="logo" aria-hidden="true"><span></span></span>
        <span class="brand">Celestea Studio</span>
        <span class="brand-tag" id="brandVersion" data-i18n-title="shell.topbar.versionTitle">Studio v…</span>
      </div>
      <div class="topbar-right">
        <button id="btnWorkbench" class="btn btn-quiet btn-workbench" data-i18n-title="shell.topbar.workbenchTitle" data-i18n-aria-label="shell.topbar.workbenchAria">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"></rect><path d="M6.5 2.5v11" fill="none" stroke="currentColor" stroke-width="1.3"></path><path d="M8.5 5.5h4M8.5 8h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg>
        </button>
        <button id="btnTheme" class="btn btn-quiet btn-theme" title="主题（黑白 · 唯一主题）">黑白</button>
        <button id="btnSidebar" class="btn btn-quiet" title="收起/展开左侧面板">收起</button>
        <button id="btnConfig" class="btn btn-quiet" data-i18n="shell.topbar.config" data-i18n-title="shell.topbar.configTitle">配置</button>
      </div>
    </header>

    <!-- ===================== 主体 ===================== -->
    <div id="layout">

      <!-- ---------- 左侧面板 ---------- -->
      <aside id="sidebar">

        <section class="side-sec" id="sec-sessions">
          <header class="side-sec-head">
            <h3>工作区 · 会话</h3>
            <span class="sec-note" id="sessionCount">…</span>
          </header>
          <div class="side-body" id="sessionTree"></div>
        </section>

        <section class="side-sec side-sec-foot">
          <div class="side-note" id="sideFoot">—</div>
        </section>
      </aside>

      <!-- ---------- 侧栏/主区分隔条（可拖动调宽 · 双击复位） ---------- -->
      <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" title="拖动调整侧栏宽度 · 双击复位"></div>

      <!-- W765：移动端会话抽屉的遮罩（点它关闭抽屉；桌面端恒为 .hidden，不参与布局） -->
      <div id="sidebarScrim" class="sidebar-scrim hidden" aria-hidden="true"></div>

      <!-- ---------- 主区 ---------- -->
      <main id="main">
        <!-- W514：多会话视图宿主——每个会话一个 .sess-pane 容器（hidden 切换，零重渲染） -->
        <div id="messages" tabindex="-1"></div>

        <!-- W867（W871 修正；W1462 再修）：.chat-shell = **输入胶囊**的圆角外框 ——
             W1462 起只圈 #statusline（模型/上下文/档位 + 右端集群）与 #inputbar（输入框 + 发送）。
             低频状态信息（会话名/空闲 · tok/s · 缓存 · 步数 · 轮次/耗时）已移到胶囊**下方**的
             贴底信息行 #statusbar（见下），灰色小字、无背景无描边 —— 信息出框、空间给输入框。
             #messages 在本层**之外**：保持屏幕边缘、保持唯一滚动容器 .sess-pane 的几何逐像素不变。
             本层不设 overflow:hidden —— 三个 .sl-popup 都从 statusline 向上弹出
             （bottom: calc(100% - 2px)），裁剪会切掉面板；圆角改由首/末子元素各自带
             （子元素自带不透明的 --composer-bg，不带角会盖住外框的圆角）。 -->
        <section class="chat-shell">
        <!-- ---------- statusline（模型 / 上下文环 / 吞吐，发送栏正上方） ---------- -->
        <div id="statusline" class="statusline" title="上下文占用 · 模型 · 思考强度 · 吞吐 · 缓存命中">
          <div class="sl-row sl-row-main">
            <span class="sl-ring" id="slRing" role="button" tabindex="0" aria-haspopup="dialog" title="上下文占用">
              <svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true">
                <circle class="sl-ring-track" cx="7" cy="7" r="5.5" transform="rotate(-90 7 7)"></circle>
                <circle class="sl-ring-prog" cx="7" cy="7" r="5.5" transform="rotate(-90 7 7)"></circle>
              </svg>
            </span>
            <span class="sl-ctx" id="slCtx">—/—</span>
            <span class="sl-sep">·</span>
            <button class="sl-model" id="slModel" title="当前模型（点击快速切换）">—</button>
            <span class="sl-sep">·</span>
            <button class="sl-effort" id="slEffort" title="思考强度（点击快速切换）">—</button>
            <span class="sl-sep">·</span>
            <!-- W788：会话工作方式（只读徽标「标准」/「执行」；点击弹层切换）。
                 显隐真源 = statusline/mode.ts —— 快照里没有 mode（老服务）时保持 .hidden。 -->
            <button class="sl-mode hidden" id="slMode" type="button" title="工作方式（点击切换）"></button>
            <!-- W847：右端集群（权限盾牌 / 车道切换 / 停止 / 提示）包进 .sl-end。
                 flex:0 0 auto + margin-left:auto 取代原 .sl-spacer：集群恒贴右缘，
                 行超宽时由 .sl-row-main 的 overflow 先裁左边的用量/模型信息，
                 取消键永不被挤出屏幕。 -->
            <div class="sl-end">
              <!-- W858：会话权限**档位**徽标（基线 preset；与右邻的 W701 盾牌是两回事：
                   盾牌管临时能力放宽，徽标管会话档位）。显隐真源 = statusline/permission.ts
                   —— 无活动会话或该部署没有档位端点时保持 .hidden（不置灰报错）。 -->
              <button id="slPerm" class="sl-perm hidden" type="button" title="会话权限档位" aria-label="会话权限档位">
                <svg class="sl-perm-icon" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path d="M5.4 7.2V5.5a2.6 2.6 0 0 1 5.2 0v1.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path><rect x="3.6" y="7.2" width="8.8" height="6.2" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"></rect></svg>
                <span class="sl-perm-badge" id="slPermBadge"></span>
              </button>
              <!-- W701：本会话权限盾牌（三态：未授予 / 已授予 / 即将失效）。
                   显隐真源 = ui/grants.ts —— 能力位未就绪时保持 .hidden（入口隐藏，不置灰报错）。 -->
              <button id="slGrant" class="sl-grant hidden" type="button" title="本会话权限：默认（仅工作区，无网络）" aria-label="本会话权限">
                <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M8 1.6 13.2 3.4v4.2c0 3.1-2.1 5.6-5.2 6.8-3.1-1.2-5.2-3.7-5.2-6.8V3.4z"></path></svg>
                <span class="sl-grant-badge" id="slGrantBadge"></span>
                <span class="sl-grant-dot" aria-hidden="true"></span>
              </button>
              <!-- W846：运行态的提交车道切换（插话/排队）从输入栏移到本行右端，与停止键同组。
                   显隐真源仍是 ui/inputbar.setInputMode。W847：≤640 只留内联箭头图标
                   （文字视觉隐藏、无障碍名保留），不占整块宽度，不为它牺牲取消键。 -->
              <button id="btnMode" class="sl-mode-btn hidden" type="button" title="提交车道：插话 / 排队">
                <svg class="sl-mode-icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M2.5 5.5h10M10 3l2.5 2.5L10 8M13.5 10.5h-10M6 8l-2.5 2.5L6 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                <span class="sl-mode-label">插话</span>
              </button>
              <!-- W302：运行中显示的正方形停止按钮（取消当前轮次；显隐真源 = ui/inputbar.setBusy） -->
              <button id="slStop" class="sl-stop hidden" type="button" title="停止本轮生成" aria-label="停止本轮生成">
                <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="1" fill="currentColor"></rect></svg>
              </button>
              <button id="slGoal" class="sl-goal hidden" type="button" title="当前目标" aria-label="当前目标">
                <span class="sl-goal-badge" id="slGoalBadge"></span>
              </button>
              <span class="sl-hint" id="slHint"></span>
            </div>
          </div>
          <!-- W1462：原第 2 行（会话条 / tok/s / 缓存 / 步数）已移出胶囊 → 贴底信息行 #statusbar。
               本行因此只剩「模型 / 上下文 / 档位 / 工作方式 + 右端集群」，statusline 不再有两行。 -->
        </div>

        <!-- ---------- 输入区（composer 的视觉主体：上下撑开） ---------- -->
        <div id="inputbar">
          <!-- W847：.input-box 承担原 #input 的 flex 槽位；图片入口 #btnAttach 由 JS 注入
               到框内（绝对定位、内联回形针 SVG），出流 ⇒ 不改变本行宽度。 -->
          <!-- W867（追加）：附件收纳展示夹 —— 由 ui/inputbar.ts 注入到 .input-box 内，
               **绝对定位浮在输入框上方**（出流）⇒ 展开/收起都不改变 #input 宽度。 -->
          <div class="input-box">
            <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行" spellcheck="false"></textarea>
          </div>
          <!-- W846：运行态不再向输入栏追加按钮 —— 车道切换（#btnMode）已移到 statusline，
               取消由 statusline 的 #slStop 单点承担（两者本就共用 chat.ts requestCancel）。
               W847：.input-side 恒为 [发送]，#input 宽度逐像素不变。 -->
          <div class="input-side">
            <button id="btnSend" class="btn btn-accent">发送</button>
          </div>
        </div>
        </section>

        <!-- W1462：低频状态信息移到胶囊（.chat-shell）**之外**、贴底平铺一行 ——
             会话名/空闲态（#sessionBar）、吞吐（#slTps）、缓存（#slCache）、步数（#slSteps）、
             连接点/文本（#statusDot/#statusText）、轮次/耗时（#statusTurn/#statusTime）。
             灰色小字、无背景、无描边、无分隔线（"不显眼"）；位置由 layout.css 的
             #statusbar 承担（.chat-shell 之后的普通 flex 子项 ⇒ 自然落在胶囊下方）。
             这些 id 是运行时与行为测试的取节点真源，层级可动、id 不可丢。 -->
        <footer id="statusbar">
          <div class="sb-left">
            <div id="sessionBar" class="session-bar" title="当前聚焦会话 · 可切换其它运行中的会话"></div>
            <span class="sl-sep">·</span>
            <span class="sl-tps" id="slTps">— tok/s</span>
            <span class="sl-sep">·</span>
            <span class="sl-cache" id="slCache" title="缓存命中：最近一次请求">缓存 —</span>
            <span class="sl-sep">·</span>
            <span class="sl-steps" id="slSteps">— 步</span>
          </div>
          <div class="sb-right">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">连接中…</span>
            <span class="sb-sep">·</span>
            <span id="statusTurn">第 — 轮</span>
            <span class="sb-sep">·</span>
            <span id="statusTime">00:00</span>
          </div>
        </footer>
      </main>
    </div>
  </div>

  <!-- ===================== 通用设置页（左导航 + 右内容） ===================== -->
  <div id="settingsPage" class="settings-page hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-shell">
      <header class="settings-head">
        <h3 id="settingsTitle">通用设置</h3>
        <div class="settings-actions">
          <button class="btn-mini" id="btnSettingsReload" title="重新载入当前页内容">重新载入</button>
          <button class="btn-mini" id="btnSettingsClose">关闭</button>
        </div>
      </header>
      <div class="settings-layout">
        <nav class="settings-nav" aria-label="设置导航">
          <!-- i18n：文案由 i18n/settings.ts 的 applyI18n 按 data-i18n 填充（不写死中文） -->
          <button class="settings-nav-item" type="button" data-page="general" data-i18n="settings.general.title"></button>
          <button class="settings-nav-item active" type="button" data-page="config">通用配置</button>
          <button class="settings-nav-item" type="button" data-page="tools">工具</button>
          <button class="settings-nav-item" type="button" data-page="archive">归档会话</button>
          <button class="settings-nav-item" type="button" data-page="providers">模型提供商</button>
          <button class="settings-nav-item" type="button" data-page="prompts">提示词</button>
          <button class="settings-nav-item" type="button" data-page="permissions">权限预设</button>
          <button class="settings-nav-item" type="button" data-page="plugins">插件</button>
        </nav>
        <div class="settings-content">
          <section class="settings-pane" data-pane="general">
            <header class="settings-pane-head">
              <h4 data-i18n="settings.general.title"></h4>
              <span class="settings-sec-note" data-i18n="settings.general.note"></span>
            </header>
            <div class="settings-pane-body" id="settingsGeneral"></div>
          </section>
          <section class="settings-pane active" data-pane="config">
            <header class="settings-pane-head">
              <h4>运行配置</h4>
              <span class="settings-sec-note">保存后下一轮生效</span>
            </header>
            <div class="settings-pane-body" id="settingsConfig"></div>
            <div class="cfg-hintline" id="settingsHint"></div>
          </section>
          <section class="settings-pane" data-pane="tools">
            <header class="settings-pane-head">
              <h4>工具列表</h4>
              <span class="sec-note" id="toolsCount">…</span>
            </header>
            <div class="settings-pane-body" id="settingsTools"></div>
          </section>
          <section class="settings-pane" data-pane="archive">
            <header class="settings-pane-head">
              <h4>归档会话管理</h4>
              <span class="sec-note" id="settingsArchiveCount">…</span>
            </header>
            <div class="settings-pane-body" id="settingsArchive"></div>
            <div class="cfg-hintline" id="settingsArchiveHint"></div>
          </section>
          <section class="settings-pane" data-pane="providers">
            <header class="settings-pane-head">
              <h4>模型提供商</h4>
              <button class="btn-mini" id="btnAddProvider" type="button">添加提供商</button>
            </header>
            <div class="settings-pane-body" id="settingsProviders"></div>
          </section>
          <section class="settings-pane" data-pane="prompts">
            <header class="settings-pane-head">
              <h4>提示词</h4>
              <button class="btn-mini" id="btnNewPrompt" type="button">新建提示词</button>
            </header>
            <div class="settings-pane-body">
              <div id="promptsWrap"></div>
              <div id="settingsPrompts"></div>
            </div>
          </section>
          <section class="settings-pane" data-pane="permissions">
            <header class="settings-pane-head">
              <h4>权限预设</h4>
              <span class="settings-sec-note">默认 Full Access；可自组合预设，运行时封顶会收窄</span>
            </header>
            <div class="settings-pane-body" id="settingsPermissions"></div>
          </section>
          <section class="settings-pane" data-pane="plugins">
            <header class="settings-pane-head">
              <h4>插件</h4>
              <span class="settings-sec-note">客户端插件即时生效；服务端插件只读</span>
            </header>
            <div class="settings-pane-body" id="settingsPlugins"></div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
