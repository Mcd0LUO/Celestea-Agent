[package]
name = "celestea-studio"
version = "0.1.0"
edition = "2021"
description = "Celestea Studio - local web UI over celestea-runtime (SSE streaming turn events)"
license = "MIT"

[dependencies]
# Engine (API frozen): turns are driven by Runtime::compose + Runtime::run_turn.
celestea-runtime = { path = "/src/celestea_harness/crates/runtime" }
# Core types not re-exported by runtime (Content / ToolDecision) used by the LoopEvent -> SSE mapper.
celestea-core = { path = "/src/celestea_harness/crates/core" }
# W263: UsageTracker (the concrete type of Runtime.usage) lives in the
# agent-loop crate; the statusline reads latest()/total() for the usage +
# cache-hit-ratio surface.
celestea-agent-loop = { path = "/src/celestea_harness/crates/agent-loop" }

axum = "0.8"
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
# W236: provider connectivity checks (GET {base_url}/models, OpenAI-style).
# Same version/features the engine's celestea-llm already resolves, so no new
# lockfile traffic.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
# W239 tests: register REAL worker sessions in the engine's SessionRegistry
# (the spawn_worker in-memory product) without composing a full Runtime.
celestea-session = { path = "/src/celestea_harness/crates/session" }
# W240 tests: scripted FakeLlm over the engine's native async-fn Llm trait
# (same crate/version the engine tests already resolve).
async-trait = "0.1"
