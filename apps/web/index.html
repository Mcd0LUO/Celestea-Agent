<!doctype html>
<html lang="zh-CN" data-theme="mono">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Celestea Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d0f12'/%3E%3Crect x='5' y='5' width='6' height='6' rx='1.2' fill='none' stroke='%237f93b0' stroke-width='1.4'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">

    <!-- ===================== 顶栏 ===================== -->
    <header id="topbar">
      <div class="topbar-left">
        <span class="logo" aria-hidden="true"><span></span></span>
        <span class="brand">Celestea Studio</span>
        <span class="brand-tag" id="brandVersion" data-i18n-title="shell.topbar.versionTitle">Studio v…</span>
      </div>
      <div class="topbar-right">
        <button id="btnWorkbench" class="btn btn-quiet btn-workbench" data-i18n-title="shell.topbar.workbenchTitle" data-i18n-aria-label="shell.topbar.workbenchAria">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"></rect><path d="M6.5 2.5v11" fill="none" stroke="currentColor" stroke-width="1.3"></path><path d="M8.5 5.5h4M8.5 8h4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg>
        </button>
        <button id="btnTheme" class="btn btn-quiet btn-theme" data-i18n-title="shell.topbar.themeTitle" data-i18n="shell.topbar.themeLabel"></button>
        <button id="btnSidebar" class="btn btn-quiet" data-i18n-title="shell.sidebar.toggleTitle" data-i18n="shell.sidebar.toggleLabel"></button>
      </div>
    </header>

    <!-- ===================== 主体 ===================== -->
    <div id="layout">

      <!-- ---------- 左侧面板 ---------- -->
      <aside id="sidebar">

        <section class="side-sec" id="sec-sessions">
          <header class="side-sec-head">
            <h3 data-i18n="shell.sessions.sectionTitle"></h3>
            <span class="sec-note" id="sessionCount">…</span>
          </header>
          <div class="side-body" id="sessionTree"></div>
        </section>

        <section class="side-sec side-sec-foot">
          <div class="side-note" id="sideFoot">—</div>
          <!-- W9103：设置入口从顶栏挪到左下角（用户要求）——图标 + 「设置」+ 用户名。
               整块可点（button），调 openSettings()。用户名由 ui/config.ts 从
               GET /auth/check 取；未登录（401）时**不显示**用户名（只留图标 + 设置），
               不编占位名。用户名超长单行截断，不许撑破侧栏（见 layout.css 的
               .side-settings-user：min-width:0 + overflow:hidden + text-overflow:ellipsis）。
               图标是内联 SVG（stroke="currentColor"），照 #btnWorkbench / #slGrant 的写法。
               侧栏收起时（#app.sidebar-collapsed）本块随侧栏一起 display:none —— 这是
               用户明确要的「拿到左下角」的可接受代价；移动端抽屉态侧栏仍显示，入口可见。 -->
          <button id="btnSettingsEntry" class="side-settings" type="button" data-i18n-title="shell.sidebar.settingsTitle" data-i18n-aria-label="shell.sidebar.settingsAria">
            <svg class="side-settings-ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M8 10.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4z" fill="none" stroke="currentColor" stroke-width="1.3"></path><path d="M13.1 9.4a1.1 1.1 0 0 0 .22 1.21l.04.04a1.33 1.33 0 1 1-1.88 1.88l-.04-.04a1.1 1.1 0 0 0-1.21-.22 1.1 1.1 0 0 0-.67 1.01v.11a1.33 1.33 0 1 1-2.66 0v-.06a1.1 1.1 0 0 0-.72-1.01 1.1 1.1 0 0 0-1.21.22l-.04.04a1.33 1.33 0 1 1-1.88-1.88l.04-.04a1.1 1.1 0 0 0 .22-1.21 1.1 1.1 0 0 0-1.01-.67h-.11a1.33 1.33 0 1 1 0-2.66h.06a1.1 1.1 0 0 0 1.01-.72 1.1 1.1 0 0 0-.22-1.21l-.04-.04a1.33 1.33 0 1 1 1.88-1.88l.04.04a1.1 1.1 0 0 0 1.21.22h.05a1.1 1.1 0 0 0 .67-1.01v-.11a1.33 1.33 0 1 1 2.66 0v.06a1.1 1.1 0 0 0 .67 1.01 1.1 1.1 0 0 0 1.21-.22l.04-.04a1.33 1.33 0 1 1 1.88 1.88l-.04.04a1.1 1.1 0 0 0-.22 1.21v.05a1.1 1.1 0 0 0 1.01.67h.11a1.33 1.33 0 1 1 0 2.66h-.06a1.1 1.1 0 0 0-1.01.67z" fill="none" stroke="currentColor" stroke-width="1.2"></path></svg>
            <span class="side-settings-text" data-i18n="shell.sidebar.settings"></span>
            <span class="side-settings-user hidden" id="settingsUser"></span>
          </button>
        </section>
      </aside>

      <!-- ---------- 侧栏/主区分隔条（可拖动调宽 · 双击复位） ---------- -->
      <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" data-i18n-title="shell.sidebar.resizerTitle"></div>

      <!-- W765：移动端会话抽屉的遮罩（点它关闭抽屉；桌面端恒为 .hidden，不参与布局） -->
      <div id="sidebarScrim" class="sidebar-scrim hidden" aria-hidden="true"></div>

      <!-- ---------- 主区 ---------- -->
      <main id="main">
        <!-- W514：多会话视图宿主——每个会话一个 .sess-pane 容器（hidden 切换，零重渲染） -->
        <div id="messages" tabindex="-1"></div>

        <!-- W867（W871 修正；W1462 再修）：.chat-shell = **输入胶囊**的圆角外框 ——
             W1462 起只圈 #statusline（模型/上下文/档位 + 右端集群）与 #inputbar（输入框 + 发送）。
             低频状态信息（会话名/空闲 · tok/s · 缓存 · 步数 · 轮次/耗时）已移到胶囊**下方**的
             贴底信息行 #statusbar（见下），灰色小字、无背景无描边 —— 信息出框、空间给输入框。
             #messages 在本层**之外**：保持屏幕边缘、保持唯一滚动容器 .sess-pane 的几何逐像素不变。
             本层不设 overflow:hidden —— 三个 .sl-popup 都从 statusline 向上弹出
             （bottom: calc(100% - 2px)），裁剪会切掉面板；圆角改由首/末子元素各自带
             （子元素自带不透明的 --composer-bg，不带角会盖住外框的圆角）。 -->
        <section class="chat-shell">
        <!-- ---------- statusline（模型 / 上下文环 / 吞吐，发送栏正上方） ---------- -->
        <div id="statusline" class="statusline" data-i18n-title="statusline.tooltip">
          <div class="sl-row sl-row-main">
            <span class="sl-ring" id="slRing" role="button" tabindex="0" aria-haspopup="dialog" data-i18n-title="shell.statusline.ringTitle">
              <svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true">
                <circle class="sl-ring-track" cx="7" cy="7" r="5.5" transform="rotate(-90 7 7)"></circle>
                <circle class="sl-ring-prog" cx="7" cy="7" r="5.5" transform="rotate(-90 7 7)"></circle>
              </svg>
            </span>
            <span class="sl-ctx" id="slCtx">—/—</span>
            <span class="sl-sep">·</span>
            <button class="sl-model" id="slModel" data-i18n-title="shell.statusline.modelTitle">—</button>
            <span class="sl-sep">·</span>
            <button class="sl-effort" id="slEffort" data-i18n-title="shell.statusline.effortTitle">—</button>
            <span class="sl-sep">·</span>
            <!-- W788：会话工作方式（只读徽标「标准」/「执行」；点击弹层切换）。
                 显隐真源 = statusline/mode.ts —— 快照里没有 mode（老服务）时保持 .hidden。 -->
            <button class="sl-mode hidden" id="slMode" type="button" data-i18n-title="shell.statusline.modeTitle"></button>
            <!-- W847：右端集群（权限盾牌 / 车道切换 / 停止 / 提示）包进 .sl-end。
                 flex:0 0 auto + margin-left:auto 取代原 .sl-spacer：集群恒贴右缘，
                 行超宽时由 .sl-row-main 的 overflow 先裁左边的用量/模型信息，
                 取消键永不被挤出屏幕。 -->
            <div class="sl-end">
              <!-- W1517：权限入口**合并**成这一个盾牌（用户本轮明确要求）——「会话档位」
                   （原 W858 的锁形档位入口）与「精细授权」（原 W701）共用一个入口、
                   一个面板（§1 会话档位 + §2 精细授权）；窄屏下两个并列按钮曾把停止键
                   挤出屏幕（docs/HANDOVER.md §P2 的用户截图）。图标沿用 W701 已有的盾牌
                   路径，不新画；档位名并入徽标区（.sl-grant-tier，与授权计数同处一格）。
                   显隐真源 = ui/grants.ts 的 capabilities.grants —— 能力位未就绪时保持
                   .hidden（入口隐藏，不置灰报错）；无活动会话/无档位端点时只撤掉档位段，
                   入口可见性不变（合并前两处各自的降级纪律，见 docs/feature-permission-entry-merge.md §4 I2）。 -->
              <button id="slGrant" class="sl-grant hidden" type="button" data-i18n-title="grants.shield.default" data-i18n-aria-label="grants.shield.default">
                <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M8 1.6 13.2 3.4v4.2c0 3.1-2.1 5.6-5.2 6.8-3.1-1.2-5.2-3.7-5.2-6.8V3.4z"></path></svg>
                <span class="sl-grant-tier" id="slGrantTier"></span>
                <span class="sl-grant-badge" id="slGrantBadge"></span>
                <span class="sl-grant-dot" aria-hidden="true"></span>
              </button>
              <!-- W846：运行态的提交车道切换（插话/排队）从输入栏移到本行右端，与停止键同组。
                   显隐真源仍是 ui/inputbar.setInputMode。W847：≤640 只留内联箭头图标
                   （文字视觉隐藏、无障碍名保留），不占整块宽度，不为它牺牲取消键。 -->
              <button id="btnMode" class="sl-mode-btn hidden" type="button" data-i18n-title="shell.statusline.laneTitle">
                <svg class="sl-mode-icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M2.5 5.5h10M10 3l2.5 2.5L10 8M13.5 10.5h-10M6 8l-2.5 2.5L6 13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                <span class="sl-mode-label" data-i18n="chat.input.interject"></span>
              </button>
              <button id="slGoal" class="sl-goal hidden" type="button" data-i18n-title="shell.statusline.goalTitle" data-i18n-aria-label="shell.statusline.goalTitle">
                <span class="sl-goal-badge" id="slGoalBadge"></span>
              </button>
              <span class="sl-hint" id="slHint"></span>
            </div>
          </div>
          <!-- W1462：原第 2 行（会话条 / tok/s / 缓存 / 步数）已移出胶囊 → 贴底信息行 #statusbar。
               本行因此只剩「模型 / 上下文 / 档位 / 工作方式 + 右端集群」，statusline 不再有两行。 -->
        </div>

        <!-- ---------- 输入区（composer 的视觉主体：上下撑开） ---------- -->
        <div id="inputbar">
          <!-- W847：.input-box 承担原 #input 的 flex 槽位；图片入口 #btnAttach 由 JS 注入
               到框内（绝对定位、内联回形针 SVG），出流 ⇒ 不改变本行宽度。 -->
          <!-- W867（追加）：附件收纳展示夹 —— 由 ui/inputbar.ts 注入到 .input-box 内，
               **绝对定位浮在输入框上方**（出流）⇒ 展开/收起都不改变 #input 宽度。 -->
          <div class="input-box">
            <textarea id="input" rows="2" data-i18n-placeholder="chat.input.placeholderIdle" spellcheck="false"></textarea>
          </div>
          <!-- W1512：发送与终止是**同一个控件的两种状态**（照 DSH）：空闲 = 发送（↑），
               运行中 = 终止（■）。为什么合并：原先终止键挂在 statusline 右端，窄屏下被
               模型名/用量/车道键挤出视口（用户报障）。放进输入栏后它**恒在可见位置**，
               且与发送键共用同一块槽位 ⇒ 两态几何逐像素一致，不推挤 #input。
               W1513：**只留图标、去掉文字**（用户要求「文字去掉只留按钮」）—— 两态都是
               纯图标，槽位收成正方形（--send-btn，见 layout.css）。无障碍名仍在
               title / aria-label 上（由 ui/inputbar 的 paintSendButton 按语言写入）。
               显隐真源仍是 ui/inputbar.setBusy；Enter 仍可插话（按钮只负责终止）。 -->
          <div class="input-side">
            <button id="btnSend" class="btn btn-accent btn-run" type="button" data-i18n-title="chat.input.sendTitle" data-i18n-aria-label="chat.input.send">
              <svg class="ico-send" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 13.2V3.2M8 3.2 3.4 7.8M8 3.2l4.6 4.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              <svg class="ico-stop" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="3.6" y="3.6" width="8.8" height="8.8" rx="1.6" fill="currentColor"></rect></svg>
            </button>
          </div>
        </div>
        </section>

        <!-- W1462：低频状态信息移到胶囊（.chat-shell）**之外**、贴底平铺一行 ——
             会话名/空闲态（#sessionBar）、吞吐（#slTps）、缓存（#slCache）、步数（#slSteps）、
             连接点/文本（#statusDot/#statusText）、轮次/耗时（#statusTurn/#statusTime）。
             灰色小字、无背景、无描边、无分隔线（"不显眼"）；位置由 layout.css 的
             #statusbar 承担（.chat-shell 之后的普通 flex 子项 ⇒ 自然落在胶囊下方）。
             这些 id 是运行时与行为测试的取节点真源，层级可动、id 不可丢。 -->
        <footer id="statusbar">
          <div class="sb-left">
            <div id="sessionBar" class="session-bar" data-i18n-title="shell.statusbar.sessionTitle"></div>
            <span class="sl-sep">·</span>
            <span class="sl-tps" id="slTps">— tok/s</span>
            <span class="sl-sep">·</span>
            <span class="sl-cache" id="slCache" data-i18n-title="shell.statusbar.cacheTitle" data-i18n="statusline.cache.none"></span>
            <span class="sl-sep">·</span>
            <span class="sl-steps" id="slSteps" data-i18n="statusline.stepsNone"></span>
          </div>
          <div class="sb-right">
            <span class="dot" id="statusDot"></span>
            <span id="statusText" data-i18n="shell.statusbar.connecting"></span>
            <span class="sb-sep">·</span>
            <span id="statusTurn" data-i18n="shell.status.turnNone"></span>
            <span class="sb-sep">·</span>
            <span id="statusTime">00:00</span>
          </div>
          <!-- W1479：屏幕阅读器的实时播报区。视觉上不可见（.sr-only），内容由
               statusbar.ts 写**阶段性**文本——不逐 token 播报（会刷屏），只报
               「开始 / 工具 / 结束 / 出错」这些阶段转换。aria-live=polite 让读屏
               在停顿处播报，aria-atomic 保证每次读完整句而非碎片。 -->
          <div id="statusLive" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
        </footer>
      </main>
    </div>
  </div>

  <!-- ===================== 通用设置页（左导航 + 右内容） ===================== -->
  <div id="settingsPage" class="settings-page hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-shell">
      <header class="settings-head">
        <h3 id="settingsTitle" data-i18n="shell.settings.title"></h3>
        <div class="settings-actions">
          <button class="btn-mini" id="btnSettingsReload" data-i18n-title="shell.settings.reloadTitle" data-i18n="settings.action.reload"></button>
          <button class="btn-mini" id="btnSettingsClose" data-i18n="shell.settings.close"></button>
        </div>
      </header>
      <div class="settings-layout">
        <nav class="settings-nav" data-i18n-aria-label="shell.settings.navAria">
          <!-- i18n：文案由 i18n/settings.ts 的 applyI18n 按 data-i18n 填充（不写死中文） -->
          <button class="settings-nav-item" type="button" data-page="general" data-i18n="settings.general.title"></button>
          <button class="settings-nav-item active" type="button" data-page="config" data-i18n="shell.settings.tab.config"></button>
          <button class="settings-nav-item" type="button" data-page="tools" data-i18n="shell.settings.tab.tools"></button>
          <button class="settings-nav-item" type="button" data-page="archive" data-i18n="shell.settings.tab.archive"></button>
          <button class="settings-nav-item" type="button" data-page="providers" data-i18n="shell.settings.tab.providers"></button>
          <button class="settings-nav-item" type="button" data-page="prompts" data-i18n="shell.settings.tab.prompts"></button>
          <button class="settings-nav-item" type="button" data-page="permissions" data-i18n="shell.settings.tab.permissions"></button>
          <button class="settings-nav-item" type="button" data-page="plugins" data-i18n="shell.settings.tab.plugins"></button>
          <!-- W9103：使用统计（文案走 i18n；本格由 ui/usage/panel.ts 挂载） -->
          <button class="settings-nav-item" type="button" data-page="usage" data-i18n="usage.nav.title"></button>
        </nav>
        <div class="settings-content">
          <section class="settings-pane" data-pane="general">
            <header class="settings-pane-head">
              <h4 data-i18n="settings.general.title"></h4>
              <span class="settings-sec-note" data-i18n="settings.general.note"></span>
            </header>
            <div class="settings-pane-body" id="settingsGeneral"></div>
          </section>
          <section class="settings-pane active" data-pane="config">
            <header class="settings-pane-head">
              <h4 data-i18n="shell.settings.pane.config"></h4>
              <span class="settings-sec-note" data-i18n="shell.settings.pane.configNote"></span>
            </header>
            <div class="settings-pane-body" id="settingsConfig"></div>
            <div class="cfg-hintline" id="settingsHint"></div>
          </section>
          <section class="settings-pane" data-pane="tools">
            <header class="settings-pane-head">
              <h4 data-i18n="shell.settings.pane.tools"></h4>
              <span class="sec-note" id="toolsCount">…</span>
            </header>
            <div class="settings-pane-body" id="settingsTools"></div>
          </section>
          <section class="settings-pane" data-pane="archive">
            <header class="settings-pane-head">
              <h4 data-i18n="shell.settings.pane.archive"></h4>
              <span class="sec-note" id="settingsArchiveCount">…</span>
            </header>
            <div class="settings-pane-body" id="settingsArchive"></div>
            <div class="cfg-hintline" id="settingsArchiveHint"></div>
          </section>
          <section class="settings-pane" data-pane="providers">
            <header class="settings-pane-head">
              <h4 data-i18n="shell.settings.tab.providers"></h4>
              <button class="btn-mini" id="btnAddProvider" type="button" data-i18n="settings.providers.add"></button>
            </header>
            <div class="settings-pane-body" id="settingsProviders"></div>
          </section>
          <section class="settings-pane" data-pane="prompts">
            <header class="settings-pane-head">
              <h4 data-i18n="shell.settings.tab.prompts"></h4>
              <button class="btn-mini" id="btnNewPrompt" type="button" data-i18n="settings.prompts.newPrompt"></button>
            </header>
            <div class="settings-pane-body">
              <div id="promptsWrap"></div>
              <div id="settingsPrompts"></div>
            </div>
          </section>
          <section class="settings-pane" data-pane="permissions">
            <header class="settings-pane-head">
              <h4 data-i18n="shell.settings.tab.permissions"></h4>
              <span class="settings-sec-note" data-i18n="shell.settings.pane.permissionsNote"></span>
            </header>
            <div class="settings-pane-body" id="settingsPermissions"></div>
          </section>
          <section class="settings-pane" data-pane="plugins">
            <header class="settings-pane-head">
              <h4 data-i18n="shell.settings.tab.plugins"></h4>
              <span class="settings-sec-note" data-i18n="shell.settings.pane.pluginsNote"></span>
            </header>
            <div class="settings-pane-body" id="settingsPlugins"></div>
          </section>
          <!-- W9103：使用统计（数据来自已有的用量账本聚合；本格由 ui/usage/panel.ts 挂载） -->
          <section class="settings-pane" data-pane="usage">
            <header class="settings-pane-head">
              <h4 data-i18n="usage.nav.title"></h4>
              <span class="settings-sec-note" data-i18n="usage.nav.note"></span>
            </header>
            <div class="settings-pane-body" id="settingsUsage"></div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
