# CI: run the full workspace test suite on every push / pull request.
# Failures block the branch, keeping prebuilt releases from being cut on a
# broken tree.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-

      - name: Run tests
        run: cargo test --workspace
