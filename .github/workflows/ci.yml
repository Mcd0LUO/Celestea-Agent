# W891 — this repo's first CI. Until now every gate (`pnpm check`: typecheck /
# lint / arch / test / web) only ran when a human remembered to run it, which is
# not a gate (docs/AGENT.md §8). Two OSes on purpose: Windows is a platform this
# repo now claims to support, so it must be measured rather than assumed.
#
# Node is a MATRIX, not `.nvmrc`'s single value. engines.node claims ">=24 <27",
# and a band measured at one point is a claim, not a measurement (W203 audit:
# "只测一个 Node 版本，而 engines.node 声称 >=24 <27"). 25 is deliberately absent:
# vitest's own engines (`^22.12.0 || ^24.0.0 || >=26.0.0`) excludes it and
# `engineStrict: true` turns that into a hard install failure — a DEV-side limit
# only, since vitest is a devDependency and production still runs on 25.
name: ci

on:
  push:
    branches: [main]
    # Tags too, and not for decoration: a release tag is a PUBLISHED artifact's
    # identity (the frontend version derives from `git describe --tags`), so
    # "did this tag pass CI?" must be answerable by looking at the tag, not by
    # tracing which main push happened to carry the same sha. W1519 learned this
    # the hard way: v2.7.5 was tagged on a commit whose CI was red on
    # windows-latest, and nothing about the tag said so.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    steps:
      # Full history + tags: the version derives from `git describe --tags`
      # (scripts/version.mjs), and the web bundle embeds it. A shallow checkout
      # would make the version gate meaningless.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
        env:
          CI: 'true'
